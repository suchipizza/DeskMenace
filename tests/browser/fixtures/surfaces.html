<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gary.js surfaces test page</title>
<script>
  // Query: char=<manifest URL>, cfg=<inline JSON>, preset=<name>
  window.__spoke = [];
  var p = new URLSearchParams(location.search);
  if (p.get('cfg')) {
    var c = document.createElement('script');
    c.type = 'application/json';
    c.setAttribute('data-gary-config', '');
    c.textContent = p.get('cfg');
    document.head.appendChild(c);
  }
  var s = document.createElement('script');
  s.src = '/dist/gary.core.js';
  s.defer = true;
  if (p.get('char')) s.dataset.character = p.get('char');
  if (p.get('preset')) s.dataset.preset = p.get('preset');
  s.onload = function () { Gary.on('spoke', function (l) { window.__spoke.push(l); }); };
  document.head.appendChild(s);
</script>
<style>
  body { margin: 0; font: 16px system-ui; min-height: 220vh; position: relative; }
  #target { position: absolute; left: 300px; top: 400px; width: 320px; height: 60px; margin: 0; background: #fde; font-size: 48px; line-height: 60px; text-align: center; }
  #high { position: absolute; left: 800px; top: 60px; width: 200px; height: 40px; margin: 0; background: #def; }
  #other { position: absolute; left: 760px; top: 450px; width: 260px; height: 40px; background: #dfd; }
</style>
</head>
<body>
<h1 id="target" data-gary-404>404</h1>
<p id="high">Too high to stand on</p>
<div id="other">Another shelf</div>
</body>
</html>
